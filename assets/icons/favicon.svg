<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4438"/>
      <stop offset="100%" stop-color="#0A1C16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1D18A"/>
      <stop offset="100%" stop-color="#B78832"/>
    </linearGradient>
    <linearGradient id="groutGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E8DFD0" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- Protective Shield Crest -->
  <path d="M32 4.5 C45 4.5 55 8.5 55 16.5 C55 36.5 43 49.5 32 58.5 C21 49.5 9 36.5 9 16.5 C9 8.5 19 4.5 32 4.5 Z" fill="url(#shieldGrad)" stroke="#D9B167" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- 4 Ceramic Tiles Grid with Clear Grout Seams -->
  <!-- Top-Left Tile (Gold) -->
  <rect x="18" y="14" width="12" height="12" rx="2.5" fill="url(#goldGrad)"/>
  <!-- Top-Right Tile (Pearl Cream) -->
  <rect x="34" y="14" width="12" height="12" rx="2.5" fill="#F4EFE6" opacity="0.95"/>
  <!-- Bottom-Left Tile (Pearl Cream) -->
  <rect x="18" y="30" width="12" height="12" rx="2.5" fill="#F4EFE6" opacity="0.95"/>
  <!-- Bottom-Right Tile (Gold) -->
  <rect x="34" y="30" width="12" height="12" rx="2.5" fill="url(#goldGrad)"/>

  <!-- Grout Line Crosshair Channels -->
  <line x1="32" y1="12" x2="32" y2="44" stroke="url(#groutGlow)" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="16" y1="28" x2="48" y2="28" stroke="url(#groutGlow)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Central Radiance Sparkle (Restoration Shine) -->
  <path d="M32 20.5 C32 25 34.5 28 39.5 28 C34.5 28 32 31 32 35.5 C32 31 29.5 28 24.5 28 C29.5 28 32 25 32 20.5 Z" fill="#FFFFFF"/>
  <circle cx="32" cy="28" r="1.8" fill="#D9B167"/>

  <!-- Clean Seal Verification Badge Mark (Shield Lower Contour) -->
  <path d="M25 47 L29.5 51.5 L39 42" fill="none" stroke="#D9B167" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
